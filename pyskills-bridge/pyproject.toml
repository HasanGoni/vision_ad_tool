[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-ad-pyskills"
version = "0.1.0"
description = "pyskills bridge for be_vision_ad_tools"
requires-python = ">=3.12"
dependencies = ["pyskills"]

[project.entry-points.pyskills]
"verify_ad.skill" = "verify_ad.skill"
"train_ad.skill" = "train_ad.skill"
"infer_ad.skill" = "infer_ad.skill"
"organize_ad.skill" = "organize_ad.skill"
"infer_organize_ad.skill" = "infer_organize_ad.skill"
"train_infer_ad.skill" = "train_infer_ad.skill"
"full_ad.skill" = "full_ad.skill"
"hyperparameter_search_ad.skill" = "hyperparameter_search_ad.skill"
"submit_train_ad_hpc.skill" = "submit_train_ad_hpc.skill"
"submit_infer_ad_hpc.skill" = "submit_infer_ad_hpc.skill"
"submit_organize_ad_hpc.skill" = "submit_organize_ad_hpc.skill"
"submit_infer_organize_ad_hpc.skill" = "submit_infer_organize_ad_hpc.skill"
"submit_train_infer_ad_hpc.skill" = "submit_train_infer_ad_hpc.skill"
"submit_full_ad_hpc.skill" = "submit_full_ad_hpc.skill"
"submit_hyperparam_search_ad_hpc.skill" = "submit_hyperparam_search_ad_hpc.skill"

[tool.setuptools.packages.find]
include = ["verify_ad*", "train_ad*", "infer_ad*", "organize_ad*", "infer_organize_ad*", "train_infer_ad*", "full_ad*", "hyperparameter_search_ad*", "submit_train_ad_hpc*", "submit_infer_ad_hpc*", "submit_organize_ad_hpc*", "submit_infer_organize_ad_hpc*", "submit_train_infer_ad_hpc*", "submit_full_ad_hpc*", "submit_hyperparam_search_ad_hpc*"]
