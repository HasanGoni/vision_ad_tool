[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vision_ad_tool"
version = "0.1.0"
description = "Anomaly detection for images"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Goni Mohammed Hasan (BE DMR AI DSE)", email = "mohammedhasan.goni@infineon.com" },
]
keywords = ["nbdev", "jupyter", "notebook", "anomaly-detection", "anomalib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "anomalib<2",
    "cloudpickle>=3.1.2",
    "colorama>=0.4.6",
    "cuda-toolkit>=13.0.1",
    "einops>=0.8.1",
    "fastcore>=1.8.13",
    "freia>=0.2",
    "hydra-core>=1.3.0",
    "imgaug>=0.4.0",
    "ipykernel==6.30.1",
    "jupyter>=1.1.1",
    "kornia>=0.8.1",
    "lightning>=2.5.5",
    "matplotlib>=3.10.7",
    "nbdev>=3.0.0",
    "numpy<2",
    "omegaconf>=2.3.0",
    "open-clip-torch>=3.2.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pip>=25.3",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.2",
    "timm>=1.0.20",
    "torchaudio>=2.9.0",
    "watermark>=2.6.0",
]

[project.urls]
Repository = "https://github.com/HasanGoni/vision_ad_tool"
Documentation = "https://HasanGoni.github.io/vision_ad_tool/"

[project.scripts]
vad-train = "be_vision_ad_tools.tutorials.end2end_cli:train_cli"
vad-infer = "be_vision_ad_tools.tutorials.end2end_cli:infer_cli"
vad-organize = "be_vision_ad_tools.tutorials.end2end_cli:organize_cli"
vad-infer-organize = "be_vision_ad_tools.tutorials.end2end_cli:infer_organize_cli"
vad-train-infer = "be_vision_ad_tools.tutorials.end2end_cli:train_infer_cli"
vad-full = "be_vision_ad_tools.tutorials.end2end_cli:full_cli"
vad-hyperparam-search = "be_vision_ad_tools.training.hyperparameter_hydra_cli:hyperparam_search_cli"
vad-train-submit = "be_vision_ad_tools.tutorials.hpc_submit_cli:train_submit_cli"
vad-infer-submit = "be_vision_ad_tools.tutorials.hpc_submit_cli:infer_submit_cli"
vad-organize-submit = "be_vision_ad_tools.tutorials.hpc_submit_cli:organize_submit_cli"
vad-infer-organize-submit = "be_vision_ad_tools.tutorials.hpc_submit_cli:infer_organize_submit_cli"
vad-train-infer-submit = "be_vision_ad_tools.tutorials.hpc_submit_cli:train_infer_submit_cli"
vad-full-submit = "be_vision_ad_tools.tutorials.hpc_submit_cli:full_submit_cli"
vad-hyperparam-search-submit = "be_vision_ad_tools.tutorials.hpc_submit_cli:hyperparam_search_submit_cli"

[project.entry-points.nbdev]
vision_ad_tool = "be_vision_ad_tools._modidx:d"

[tool.setuptools.packages.find]
include = ["be_vision_ad_tools*", "tutorials*"]

[tool.setuptools.package-data]
"be_vision_ad_tools.tutorials" = ["conf/*.yaml", "conf/hpc/*.yaml"]

[tool.nbdev]
lib_path = "be_vision_ad_tools"
nbs_path = "nbs"
doc_path = "_docs"
branch = "main"
user = "HasanGoni"
repo = "vision_ad_tool"
custom_sidebar = false
recursive = true
tst_flags = "notest"
put_version_in_init = true
update_pyproject = true
doc_host = "https://HasanGoni.github.io"
doc_baseurl = "/vision_ad_tool"
git_url = "https://github.com/HasanGoni/vision_ad_tool"
title = "vision_ad_tool"

[tool.uv.extra-build-dependencies]
vision-ad-tool = ["setuptools>=64"]

